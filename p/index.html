<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>VinoTrust Passport</title>
<style>
  :root { --bg:#120a0c; --card:#1d1214; --fg:#f4ece6; --muted:#b9a9a2; --accent:#9e2b3a;
          --closed:#e5484d; --opened:#30a46c; --line:#2e2124; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif;
         padding:16px; line-height:1.45; }
  main { max-width:520px; margin:0 auto; }
  .kicker { color:var(--muted); font-size:12px; letter-spacing:.12em; margin:8px 0 4px; }
  h1 { font-family:Georgia,serif; font-weight:400; font-size:30px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:12px 0; }
  .card h2 { font-size:13px; letter-spacing:.08em; color:var(--muted); font-weight:600; margin:0 0 10px; text-transform:uppercase; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row span:first-child { color:var(--muted); }
  .row span:last-child { text-align:right; }
  .status { font-weight:700; font-size:18px; }
  .closed { color:var(--closed); } .opened { color:var(--opened); }
  .cert { padding:4px 0; } .cert.no { color:var(--muted); }
  .stage { position:relative; width:100%; height:300px; margin:8px 0 6px; border-radius:18px; overflow:hidden;
           background:radial-gradient(ellipse at 50% 40%, #fbf7f1 0%, #ece3d6 70%, #d9cdbd 100%); }
  .stage > * { position:absolute; left:50%; top:50%; transform-origin:50% 50%; }
  .stage img { mix-blend-mode:multiply; }
  .stage svg { filter:drop-shadow(0 10px 16px rgba(0,0,0,.35)); }
  .pose { text-align:center; color:var(--muted); font-size:14px; margin:4px 0 2px; }
  .pose b { color:var(--fg); font-weight:600; }
  .imgnote { text-align:center; color:var(--muted); font-size:11px; margin:0 0 8px; }
  .bottle-wrap { display:flex; justify-content:center; margin:8px 0 4px; }
  .bottle-wrap svg { width:150px; height:auto; filter:drop-shadow(0 14px 22px rgba(0,0,0,.55)); }
  .title { text-align:center; }
  .hero { display:flex; gap:14px; align-items:flex-start; }
  .hero img { width:64px; max-height:170px; object-fit:contain; }
  .note { color:var(--muted); font-size:13px; }
  a.btn { display:block; margin:16px 0; padding:14px; border-radius:14px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; text-align:center; }
</style>
</head>
<body>
<main>
  <p class="kicker">VINOTRUST · WINE BOTTLE PASSPORT</p>
  <div id="app"><p class="sub">Loading passport…</p></div>
  <a class="btn" id="open" href="#" hidden>Open in the VinoTrust app</a>
  <p class="note">Owner name and storage location are never shown.</p>
</main>
<script>
// D-034: public view of a passport the seller shared. Only data from get_shared_passport.
// The publishable key is meant to be public; access is limited by the database function.
var SUPABASE_URL = "https://zslrsrvupkheexvewsoh.supabase.co";
var PUBLISHABLE_KEY = "sb_publishable_f_DOgYR1g17hSsvzefb4ww_xq0rEo2b";

var app = document.getElementById("app");
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function d(s, time) { if (!s) return "—"; var o = { year:"numeric", month:"short", day:"numeric" };
  if (time) { o.hour = "2-digit"; o.minute = "2-digit"; } return new Date(s).toLocaleString("en-GB", o); }
function n(v) { return (v == null) ? "—" : (Math.round(v * 10) / 10).toString(); }
function card(title) { var c = el("div", "card"); c.appendChild(el("h2", null, title)); app.appendChild(c); return c; }
function row(c, k, v) { var r = el("div", "row"); r.appendChild(el("span", null, k)); r.appendChild(el("span", null, v)); c.appendChild(r); }
function cert(c, ok, text) { c.appendChild(el("div", "cert" + (ok ? "" : " no"), (ok ? "✓ " : "○ ") + text)); }
function fail(title, text) { app.innerHTML = ""; app.appendChild(el("h1", null, title)); app.appendChild(el("p", "sub", text)); }

var t = (new URLSearchParams(location.search).get("t") || "").toLowerCase();
if (!/^[0-9a-f]{32}$/.test(t)) {
  fail("Link not valid", "Please ask the seller for a new link.");
} else {
  var open = document.getElementById("open");
  open.href = "vinotrust://passport/" + t; open.hidden = false;
  fetch(SUPABASE_URL + "/rest/v1/rpc/get_shared_passport", {
    method: "POST",
    headers: { "apikey": PUBLISHABLE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_token: t })
  }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { fail("Passport not available", "Please try again later."); });
}


var NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
function fitText(str, max) { str = String(str || ""); return str.length > max ? str.slice(0, max - 1) + "…" : str; }
function bottleSVG(b) {
  var s = svgEl("svg", { viewBox: "0 0 200 560", role: "img", "aria-label": "Bottle " + (b.name || "") });
  var defs = svgEl("defs", {});
  var g = svgEl("linearGradient", { id: "glass", x1: "0", x2: "1", y1: "0", y2: "0" });
  [["0", "#0b1a12"], [".18", "#1f3a2a"], [".32", "#0f2419"], [".75", "#08140d"], ["1", "#030805"]].forEach(function (st) {
    g.appendChild(svgEl("stop", { offset: st[0], "stop-color": st[1] })); });
  var cap = svgEl("linearGradient", { id: "cap", x1: "0", x2: "1", y1: "0", y2: "0" });
  [["0", "#4a0f18"], [".35", "#9e2b3a"], ["1", "#2a070d"]].forEach(function (st) {
    cap.appendChild(svgEl("stop", { offset: st[0], "stop-color": st[1] })); });
  var lab = svgEl("linearGradient", { id: "label", x1: "0", x2: "1", y1: "0", y2: "0" });
  [["0", "#d9d0c3"], [".2", "#f7f2ea"], [".8", "#efe7da"], ["1", "#c9bfb1"]].forEach(function (st) {
    lab.appendChild(svgEl("stop", { offset: st[0], "stop-color": st[1] })); });
  defs.appendChild(g); defs.appendChild(cap); defs.appendChild(lab); s.appendChild(defs);
  // Bordeaux silhouette
  s.appendChild(svgEl("path", { fill: "url(#glass)", d:
    "M84 20 H116 V150 C116 192 180 190 180 238 V532 C180 546 170 556 156 556 H44 C30 556 20 546 20 532 V238 C20 190 84 192 84 150 Z" }));
  s.appendChild(svgEl("rect", { x: 81, y: 14, width: 38, height: 104, rx: 4, fill: "url(#cap)" }));
  s.appendChild(svgEl("rect", { x: 79, y: 12, width: 42, height: 10, rx: 3, fill: "#5c1420" }));
  s.appendChild(svgEl("path", { d: "M30 300 v220", stroke: "rgba(255,255,255,.10)", "stroke-width": 6, "stroke-linecap": "round" }));
  // label
  s.appendChild(svgEl("rect", { x: 26, y: 300, width: 148, height: 170, rx: 3, fill: "url(#label)" }));
  s.appendChild(svgEl("rect", { x: 34, y: 308, width: 132, height: 154, rx: 2, fill: "none", stroke: "#b8963e", "stroke-width": 1 }));
  var t = function (y, str, size, weight, color, family, spacing) {
    s.appendChild(svgEl("text", { x: 100, y: y, "text-anchor": "middle", "font-size": size, "font-weight": weight || 400,
      fill: color || "#2a1a14", "font-family": family || "Georgia, serif", "letter-spacing": spacing || 0 }, str)); };
  t(338, fitText((b.producer || "").toUpperCase(), 16), 15, 400, "#2a1a14", "Georgia, serif", 1.5);
  s.appendChild(svgEl("line", { x1: 70, x2: 130, y1: 350, y2: 350, stroke: "#b8963e", "stroke-width": 1 }));
  t(382, fitText(b.name, 14), 20, 400, "#5c1420");
  t(410, fitText(b.region, 22), 10, 600, "#4a3a32", "-apple-system, system-ui, sans-serif", 1);
  t(440, b.vintage ? String(b.vintage) : "", 18, 400, "#2a1a14");
  t(456, b.size_ml ? b.size_ml + " mL" : "", 8, 400, "#7a6a60", "-apple-system, system-ui, sans-serif");
  return s;
}

function render(p) {
  if (!p) { fail("This passport is not shared (any more)", "The seller may have stopped sharing it, or the link has expired."); return; }
  app.innerHTML = "";
  var b = p.bottle || {};
  // Bottle shown in the position it lay most of the time (D-033: measured angles only).
  var h0 = p.history || {};
  var tilt = (h0.typical_tilt_deg != null) ? h0.typical_tilt_deg : null;
  var stage = el("div", "stage");
  app.appendChild(stage);
  var rot = (tilt == null) ? 0 : (tilt - 90);
  function place(node, ar) {
    var W = stage.clientWidth, S = stage.clientHeight, t = Math.abs(rot) * Math.PI / 180;
    var hh = 0.9 * Math.min(W / (Math.abs(Math.sin(t)) + ar * Math.abs(Math.cos(t))),
                            S / (Math.abs(Math.cos(t)) + ar * Math.abs(Math.sin(t))));
    node.style.height = hh + "px"; node.style.width = (hh * ar) + "px";
    node.style.transform = "translate(-50%, -50%) rotate(" + rot + "deg)";
  }
  function drawn() { stage.innerHTML = ""; var sv = bottleSVG(b); stage.appendChild(sv); place(sv, 200 / 560); }
  if (b.image_url && /^https:\/\//.test(b.image_url)) {
    var img = el("img"); img.alt = b.name || "Bottle"; img.referrerPolicy = "no-referrer";
    img.onload = function () { place(img, img.naturalWidth / img.naturalHeight); };
    img.onerror = drawn;
    img.src = b.image_url; stage.appendChild(img);
  } else { drawn(); }
  if (tilt != null) {
    var pos = Math.abs(tilt) < 20 ? "lying" : (Math.abs(tilt) > 60 ? "standing" : "tilted");
    var dir = Math.abs(tilt) < 1 ? "" : (tilt > 0 ? ", neck " + n(Math.abs(tilt)) + "° up" : ", neck " + n(Math.abs(tilt)) + "° down");
    var pose = el("p", "pose");
    pose.appendChild(document.createTextNode("Stored "));
    pose.appendChild(el("b", null, pos + dir));
    pose.appendChild(document.createTextNode(" – " + n(h0.typical_tilt_pct) + " % of the time"));
    app.appendChild(pose);
  }
  if (b.image_url) app.appendChild(el("p", "imgnote", "Picture: producer / retailer · prototype"));
  var txt = el("div", "title");
  txt.appendChild(el("h1", null, b.name || "Bottle"));
  txt.appendChild(el("p", "sub", [b.producer, b.vintage, b.region, b.country, b.size_ml ? b.size_ml + " mL" : null].filter(Boolean).join(" · ")));
  app.appendChild(txt);

  var s = p.seal, c = card("Cork seal");
  if (s) {
    if (s.status === "opened") {
      c.appendChild(el("div", "status opened", "Opened on " + d(s.opened_at, true)));
      c.appendChild(el("div", "note", "Saved permanently – this cannot be undone."));
    } else {
      c.appendChild(el("div", "status closed", "Original cork – not opened"));
      c.appendChild(el("div", "note", "Sealed since " + d(s.sealed_since, true)));
    }
    row(c, "Last checked", d(s.last_checked_at, true));
    if (s.uid_end) row(c, "Seal number ends in", s.uid_end);
  } else { c.appendChild(el("div", "note", "No VinoTrust seal on this bottle.")); }

  var h = p.history; c = card("Storage history");
  if (h && h.readings > 0) {
    row(c, "Recorded", d(h.from) + " – " + d(h.to));
    row(c, "Bottle temperature", n(h.bottle_temp_min) + " – " + n(h.bottle_temp_max) + " °C");
    row(c, "Average", n(h.bottle_temp_avg) + " °C");
    row(c, "Humidity", n(h.humidity_min) + " – " + n(h.humidity_max) + " %");
    if (h.typical_tilt_deg != null) row(c, "Typical position", n(h.typical_tilt_deg) + "° (" + n(h.typical_tilt_pct) + " % of the time)");
    if (h.lying_pct != null) row(c, "Stored lying", n(h.lying_pct) + " % of the time");
    if (h.standing_pct) row(c, "Standing", n(h.standing_pct) + " %");
    if (p.sensor && p.sensor.last_moved_at) row(c, "Last moved", d(p.sensor.last_moved_at, true));
    row(c, "Measurements", String(h.readings));
    if (h.invalid_readings > 0) c.appendChild(el("div", "note", h.invalid_readings + " faulty readings (sensor start-up) are not used."));
  } else { c.appendChild(el("div", "note", "No storage sensor on this bottle.")); }

  c = card("Certificates");
  if (s) { cert(c, !!s.nxp_signature, "Chip: NXP original (signature checked)");
           cert(c, !!s.key_secured, "Seal key secured in the VinoTrust cloud"); }
  if (p.history_seals && p.history_seals.count > 0) cert(c, true, "History sealed " + p.history_seals.count + "× in the cloud (tamper-proof chain)");
  if (p.sensor && p.sensor.calibrated_at) cert(c, true, "Sensor calibrated on " + d(p.sensor.calibrated_at));
  else if (p.sensor && p.sensor.present) cert(c, false, "Sensor calibration: prototype, not yet");
  cert(c, false, "Winery certificate: not yet");

  var f = el("p", "note", "Shared by the seller on " + d(p.shared_since, true) + (p.expires_at ? " · valid until " + d(p.expires_at, true) : "") + ".");
  app.appendChild(f);
}
</script>
</body>
</html>
